name: Build RedAlien for iOS 12

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build RedAlien
    runs-on: ubuntu-22.04

    env:
      THEOS: ${{ github.workspace }}/theos
      SDK_VERSION: "12.4"
      MIN_IOS_VERSION: "12.0"
      ARCHS: arm64

    steps:
      # 1. Checkout project
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Install dependencies
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y software-properties-common

          sudo add-apt-repository -y universe
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            fakeroot \
            dpkg-dev \
            perl \
            curl \
            git \
            xz-utils \
            unzip \
            zip \
            libio-compress-lzma-perl \
            libtinfo5 \
            libzstd-dev \
            ca-certificates \
            file

          ldconfig -p | grep libtinfo.so.5

      # 3. Install Theos
      - name: Install Theos
        shell: bash
        run: |
          set -euo pipefail

          THEOS_REPO="https://github.com/theos/theos.git"

          echo "Repository: $THEOS_REPO"

          # Validate URL before cloning
          if [[ "$THEOS_REPO" != "https://github.com/theos/theos.git" ]]; then
            echo "ERROR: Invalid Theos repository URL"
            exit 1
          fi

          # Clean previous installation
          rm -rf "$THEOS"

          # Clone official repository
          git clone --depth 1 --recursive \
            "$THEOS_REPO" "$THEOS"

          # Verify installation
          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/makefiles"

          echo "Theos installation successful"
          git -C "$THEOS" remote -v
          git -C "$THEOS" rev-parse HEAD

      # 4. Download Linux iOS toolchain
      - name: Install iOS toolchain
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_URL="https://github.com/sbingner/llvm-project/releases/download/v10.0.0-2/linux-ios-arm64e-clang-toolchain.tar.lzma"

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          echo "Downloading official Linux iOS toolchain..."

          curl -fL --retry 3 \
            "$TOOLCHAIN_URL" \
            -o "$TMP_DIR/toolchain.tar.lzma"

          # Verify LZMA archive
          file "$TMP_DIR/toolchain.tar.lzma"

          xz --format=lzma -t "$TMP_DIR/toolchain.tar.lzma"

          # Extract LZMA-compressed TAR
          mkdir -p "$TMP_DIR/extracted"

          tar --lzma -xvf "$TMP_DIR/toolchain.tar.lzma" \
            -C "$TMP_DIR/extracted"

          SOURCE="$TMP_DIR/extracted/ios-arm64e-clang-toolchain"

          if [ ! -d "$SOURCE" ]; then
            echo "ERROR: Expected toolchain directory not found"
            find "$TMP_DIR/extracted" -maxdepth 3 -print
            exit 1
          fi

          # Install into Theos
          mkdir -p "$THEOS/toolchain/linux/iphone"

          cp -a "$SOURCE/." \
            "$THEOS/toolchain/linux/iphone/"

          # Verify compiler
          CLANG="$THEOS/toolchain/linux/iphone/bin/clang"

          if [ ! -x "$CLANG" ]; then
            echo "ERROR: clang executable missing"
            exit 1
          fi

          # Find ldid
          LDID="$(find "$THEOS/toolchain/linux/iphone" \
            -type f -name ldid -print -quit)"

          if [ -z "$LDID" ]; then
            echo "ERROR: ldid missing from toolchain"
            exit 1
          fi

          chmod +x "$LDID"
          sudo ln -sf "$LDID" /usr/local/bin/ldid

          echo "Checking compiler dependencies..."
          ldd "$CLANG" || true

          echo "Checking compiler..."
          "$CLANG" --version

          echo "Checking ldid..."
          command -v ldid

          echo "Toolchain installed successfully"

      # 5. Download iOS 12.4 SDK
      - name: Install iOS SDK
        run: |
          set -eux

          SDKS_REPO="https://github.com/theos/sdks.git"

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          git clone --depth 1 "$SDKS_REPO" "$TMP_DIR/sdks"

          SDK_PATH="$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

          mkdir -p "$THEOS/sdks"
          mv "$TMP_DIR/sdks/iPhoneOS${SDK_VERSION}.sdk" "$SDK_PATH"

          if [ ! -d "$SDK_PATH" ]; then
            echo "ERROR: SDK not found at $SDK_PATH"
            ls "$TMP_DIR/sdks"
            exit 1
          fi

          echo "SDK installed:"
          ls -la "$SDK_PATH"

      # 6. Verify environment
      - name: Verify build environment
        run: |
          set -eux

          echo "THEOS=$THEOS"
          echo "SDK_VERSION=$SDK_VERSION"
          echo "MIN_IOS_VERSION=$MIN_IOS_VERSION"
          echo "ARCHS=$ARCHS"

          test -f Makefile

          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

          test -d "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

          command -v ldid
          command -v dpkg-deb
          command -v fakeroot

          ldid -h || true

          echo "Environment is ready"


      - name: Diagnose ARM architecture flags
        run: |
          set -eux

          echo "Searching project configuration..."

          grep -RInE --exclude-dir=.git \
            --exclude-dir=.theos \
            --exclude-dir=theos \
            -- '-march=armv6|-mcpu=arm1176' . || true

          echo "Checking environment flags..."

          env | sort | grep -E \
            '^(CFLAGS|CXXFLAGS|CPPFLAGS|LDFLAGS|ARCHS|TARGET)=' || true

      # 7. Build package
      - name: Build DEB package
        run: |
          set -eux

          make clean || true

          set -o pipefail

          make package \
            FINALPACKAGE=1 \
            THEOS="$THEOS" \
            ARCHS="$ARCHS" \
            TARGET="iphone:clang:${SDK_VERSION}:${MIN_IOS_VERSION}" \
            V=1 \
            2>&1 | tee build.log

      # 8. Upload build log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redalien-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      # 9. Verify package
      - name: Verify DEB package
        run: |
          set -eux

          mkdir -p build-output

          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -exec cp {} build-output/ \;

          if ! ls build-output/*.deb >/dev/null 2>&1; then
            echo "ERROR: No DEB package generated"
            exit 1
          fi

          for package in build-output/*.deb; do
            echo "Package: $package"

            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
          done

      # 10. Upload artifact
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: redalien-ios12
          path: build-output/*.deb
          if-no-files-found: error
          retention-days: 14
