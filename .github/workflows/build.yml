name: Build RedAlien for iOS 12

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot xz-utils zip unzip curl git clang llvm perl libio-compress-perl
          
          # Ставим свежий ldid напрямую с GitHub
          sudo curl -fsSL https://github.com -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid

          # Клонируем сам Theos и SDK ровно в $GITHUB_WORKSPACE/theos
          git clone --recursive https://github.com "$GITHUB_WORKSPACE/theos"
          git clone --depth 1 https://github.com "$GITHUB_WORKSPACE/theos/sdks"

      - name: Build DEB package
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: redalien-ios12
          path: packages/*.deb
