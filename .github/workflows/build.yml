name: Build RedAlien for iOS 12

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos & Toolchain (Fast Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot xz-utils zip unzip curl git perl libio-compress-perl jq
          
          GH="https://github.com"
          sudo curl -fsSL "$GH/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64" -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid

          # Клонируем Theos
          git clone --recursive "$GH/theos/theos.git" "$GITHUB_WORKSPACE/theos"

          # Автоматически берём ссылку на актуальный архив тулчейна через API
          mkdir -p "$GITHUB_WORKSPACE/theos/toolchain/linux/iphone"
          TOOLCHAIN_URL=$(curl -fsSL "https://github.com" | jq -r '.assets[] | select(.name | test("linux.*x86_64.*\\.tar\\.(xz|gz)")) | .browser_download_url' | head -n 1)
          echo "Downloading toolchain: $TOOLCHAIN_URL"
          curl -fsSL "$TOOLCHAIN_URL" -o /tmp/toolchain.tar
          tar -xf /tmp/toolchain.tar -C "$GITHUB_WORKSPACE/theos/toolchain/linux/iphone" --strip-components=1

          # Скачиваем SDK
          rm -rf "$GITHUB_WORKSPACE/theos/sdks"
          git clone --depth 1 "$GH/theos/sdks.git" "$GITHUB_WORKSPACE/theos/sdks"

      - name: Build DEB package
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: redalien-ios12
          path: packages/*.deb
