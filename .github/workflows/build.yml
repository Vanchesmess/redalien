name: Build RedAlien for iOS 12

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies & Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot ldid xz-utils zip unzip curl git clang llvm
          git clone --recursive https://github.com $GITHUB_WORKSPACE/theos
          git clone --depth 1 https://github.com $GITHUB_WORKSPACE/theos/sdks

      - name: Build DEB package
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: redalien-ios12
          path: packages/*.deb
