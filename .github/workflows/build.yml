name: Build RedAlien for iOS 12

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos via official script
        run: |
          # Запускаем официальный инсталлятор Theos в неинтерактивном режиме
          yes "" | bash -c "$(curl -fsSL https://githubusercontent.com)"
          
          # Привязываем установленный Theos туда, где его ищет Makefile
          ln -s ~/theos "$GITHUB_WORKSPACE/theos"

      - name: Build DEB package
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: redalien-ios12
          path: packages/*.deb
