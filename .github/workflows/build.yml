
name: Build RedAlien for iOS 12

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build RedAlien
    runs-on: ubuntu-22.04

    env:
      THEOS: ${{ github.workspace }}/theos
      SDK_VERSION: "12.4"
      MIN_IOS_VERSION: "12.0"
      ARCHS: arm64

    steps:
      # 1. Checkout project
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Install dependencies
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            fakeroot \
            dpkg-dev \
            perl \
            curl \
            git \
            xz-utils \
            unzip \
            zip \
            libio-compress-lzma-perl \
            ca-certificates \
            file
                  - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y software-properties-common

          sudo add-apt-repository -y universe
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            fakeroot \
            dpkg-dev \
            perl \
            curl \
            git \
            xz-utils \
            unzip \
            zip \
            libio-compress-lzma-perl \
            libtinfo5 \
            ca-certificates \
            file

          ldconfig -p | grep libtinfo.so.5

      # 3. Install Theos
      - name: Install Theos
        run: |
          set -eux

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          mkdir -p "$THEOS/toolchain/linux/iphone"
          mkdir -p "$THEOS/sdks"

      # 4. Download Linux iOS toolchain
      # ldid is included in this toolchain.
      - name: Install iOS toolchain
        run: |
          set -eux

          TOOLCHAIN_URL="https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma"

          TMP_DIR="$(mktemp -d)"

          curl -fL --retry 3 \
            "$TOOLCHAIN_URL" \
            -o "$TMP_DIR/toolchain.tar.lzma"

          tar --lzma -xf "$TMP_DIR/toolchain.tar.lzma" \
            -C "$TMP_DIR"

          TOOLCHAIN_SOURCE="$TMP_DIR/ios-arm64e-clang-toolchain"

          if [ ! -d "$TOOLCHAIN_SOURCE" ]; then
            echo "ERROR: Toolchain archive has unexpected structure"
            find "$TMP_DIR" -maxdepth 3 -print
            exit 1
          fi

          cp -a "$TOOLCHAIN_SOURCE/." \
            "$THEOS/toolchain/linux/iphone/"

          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/clang" ]; then
            echo "ERROR: clang not found"
            find "$THEOS/toolchain/linux/iphone" -maxdepth 4 -print
            exit 1
          fi

          # Find bundled ldid
          LDID_PATH="$(find "$THEOS/toolchain/linux/iphone" \
            -type f -name ldid -print -quit)"

          if [ -z "$LDID_PATH" ]; then
            echo "ERROR: ldid not found in toolchain"
            find "$THEOS/toolchain/linux/iphone" -maxdepth 5 -print
            exit 1
          fi

          chmod +x "$LDID_PATH"

          sudo ln -sf "$LDID_PATH" /usr/local/bin/ldid

          echo "Toolchain installed:"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

          echo "ldid location:"
          command -v ldid

          file "$LDID_PATH"

          rm -rf "$TMP_DIR"

      # 5. Download iOS 12.4 SDK
      - name: Install iOS SDK
        run: |
          set -eux

          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS12.4.sdk.tar.xz"

          curl -fL --retry 3 \
            "$SDK_URL" \
            -o /tmp/iPhoneOS12.4.sdk.tar.xz

          tar -xJf /tmp/iPhoneOS12.4.sdk.tar.xz \
            -C "$THEOS/sdks"

          SDK_PATH="$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

          if [ ! -d "$SDK_PATH" ]; then
            echo "ERROR: SDK not found at $SDK_PATH"
            find "$THEOS/sdks" -maxdepth 2 -type d
            exit 1
          fi

          echo "SDK installed:"
          ls -la "$SDK_PATH"

          rm -f /tmp/iPhoneOS12.4.sdk.tar.xz

      # 6. Verify environment
      - name: Verify build environment
        run: |
          set -eux

          echo "THEOS=$THEOS"
          echo "SDK_VERSION=$SDK_VERSION"
          echo "MIN_IOS_VERSION=$MIN_IOS_VERSION"
          echo "ARCHS=$ARCHS"

          test -f Makefile

          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

          test -d "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

          command -v ldid
          command -v dpkg-deb
          command -v fakeroot

          ldid -h || true

          echo "Environment is ready"

      # 7. Build package
      - name: Build DEB package
        run: |
          set -eux

          make clean || true

          make package \
            FINALPACKAGE=1 \
            THEOS="$THEOS" \
            ARCHS="$ARCHS" \
            TARGET="iphone:clang:${SDK_VERSION}:${MIN_IOS_VERSION}"

      # 8. Verify package
      - name: Verify DEB package
        run: |
          set -eux

          mkdir -p build-output

          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -exec cp {} build-output/ \;

          if ! ls build-output/*.deb >/dev/null 2>&1; then
            echo "ERROR: No DEB package generated"
            exit 1
          fi

          for package in build-output/*.deb; do
            echo "Package: $package"

            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
          done

      # 9. Upload artifact
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: redalien-ios12
          path: build-output/*.deb
          if-no-files-found: error
          retention-days: 14
