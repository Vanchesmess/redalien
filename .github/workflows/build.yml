name: Build RedAlien for iOS 12

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build RedAlien
    runs-on: ubuntu-22.04

    env:
      THEOS: ${{ github.workspace }}/theos
      SDK_VERSION: "12.4"
      MIN_IOS_VERSION: "12.0"
      ARCHS: arm64

    steps:
      # 1. Checkout project
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Install dependencies
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y software-properties-common

          sudo add-apt-repository -y universe
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            fakeroot \
            dpkg-dev \
            perl \
            curl \
            git \
            xz-utils \
            unzip \
            zip \
            libio-compress-lzma-perl \
            libtinfo5 \
            ca-certificates \
            file

          ldconfig -p | grep libtinfo.so.5

      # 3. Install Theos
      - name: Install Theos
        shell: bash
        run: |
          set -euo pipefail

          THEOS_REPO="https://github.com/theos/theos.git"

          echo "Repository: $THEOS_REPO"

          # Validate URL before cloning
          if [[ "$THEOS_REPO" != "https://github.com/theos/theos.git" ]]; then
            echo "ERROR: Invalid Theos repository URL"
            exit 1
          fi

          # Clean previous installation
          rm -rf "$THEOS"

          # Clone official repository
          git clone --depth 1 --recursive \
            "$THEOS_REPO" "$THEOS"

          # Verify installation
          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/makefiles"

          echo "Theos installation successful"
          git -C "$THEOS" remote -v
          git -C "$THEOS" rev-parse HEAD

      # 4. Download Linux iOS toolchain
      - name: Install iOS toolchain
        run: |
          set -eux

          sudo apt-get update
          sudo apt-get install -y jq curl xz-utils zstd

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          # Get actual release asset URL from GitHub API
          API_URL="https://api.github.com/repos/sbingner/llvm-project/releases/tags/v10.0.0-2"

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "$API_URL" \
            -o "$TMP_DIR/release.json"

          echo "Available release assets:"
          jq -r '.assets[] | "\(.name) \(.browser_download_url)"' \
            "$TMP_DIR/release.json"

          # Select the Linux toolchain archive automatically
          ASSET_URL="$(jq -r '
            .assets[]
            | select(
                (.name | ascii_downcase | contains("linux"))
                and
                (.name | test("\\.(tar\\.xz|tar\\.lzma|tar\\.zst|tar\\.gz)$"))
              )
            | .browser_download_url
          ' "$TMP_DIR/release.json" | head -n 1)"

          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: Linux toolchain archive not found"
            exit 1
          fi

          echo "Downloading: $ASSET_URL"

          curl -fL --retry 3 \
            "$ASSET_URL" \
            -o "$TMP_DIR/toolchain.archive"

          # Verify archive before extraction
          file "$TMP_DIR/toolchain.archive"

          if ! tar -tf "$TMP_DIR/toolchain.archive" \
              > "$TMP_DIR/archive-list.txt"; then
            echo "ERROR: Downloaded file is not a valid tar archive"
            head -c 500 "$TMP_DIR/toolchain.archive"
            exit 1
          fi

          mkdir -p "$THEOS/toolchain/linux/iphone"

          tar -xf "$TMP_DIR/toolchain.archive" \
            -C "$THEOS/toolchain/linux/iphone" \
            --strip-components=1

          # Locate compiler
          CLANG_PATH="$(find "$THEOS/toolchain/linux/iphone" \
            -type f -name clang -perm -111 -print -quit)"

          if [ -z "$CLANG_PATH" ]; then
            echo "ERROR: clang not found"
            find "$THEOS/toolchain/linux/iphone" -maxdepth 4
            exit 1
          fi

          # Locate ldid
          LDID_PATH="$(find "$THEOS/toolchain/linux/iphone" \
            -type f -name ldid -perm -111 -print -quit)"

          if [ -z "$LDID_PATH" ]; then
            echo "ERROR: ldid not found"
            exit 1
          fi

          sudo ln -sf "$LDID_PATH" /usr/local/bin/ldid

          echo "Compiler:"
          "$CLANG_PATH" --version

          echo "ldid:"
          ldid -h || true

          echo "Toolchain installed successfully"

      # 5. Download iOS 12.4 SDK
      - name: Install iOS SDK
        run: |
          set -eux

          SDKS_REPO="https://github.com/theos/sdks.git"

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          git clone --depth 1 "$SDKS_REPO" "$TMP_DIR/sdks"

          SDK_PATH="$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

          mkdir -p "$THEOS/sdks"
          mv "$TMP_DIR/sdks/iPhoneOS${SDK_VERSION}.sdk" "$SDK_PATH"

          if [ ! -d "$SDK_PATH" ]; then
            echo "ERROR: SDK not found at $SDK_PATH"
            ls "$TMP_DIR/sdks"
            exit 1
          fi

          echo "SDK installed:"
          ls -la "$SDK_PATH"

      # 6. Verify environment
      - name: Verify build environment
        run: |
          set -eux

          echo "THEOS=$THEOS"
          echo "SDK_VERSION=$SDK_VERSION"
          echo "MIN_IOS_VERSION=$MIN_IOS_VERSION"
          echo "ARCHS=$ARCHS"

          test -f Makefile

          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

          test -d "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

          command -v ldid
          command -v dpkg-deb
          command -v fakeroot

          ldid -h || true

          echo "Environment is ready"

      # 7. Build package
      - name: Build DEB package
        run: |
          set -eux

          make clean || true

          set -o pipefail

          make package \
            FINALPACKAGE=1 \
            THEOS="$THEOS" \
            ARCHS="$ARCHS" \
            TARGET="iphone:clang:${SDK_VERSION}:${MIN_IOS_VERSION}" \
            V=1 \
            2>&1 | tee build.log

      # 8. Upload build log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redalien-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      # 9. Verify package
      - name: Verify DEB package
        run: |
          set -eux

          mkdir -p build-output

          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -exec cp {} build-output/ \;

          if ! ls build-output/*.deb >/dev/null 2>&1; then
            echo "ERROR: No DEB package generated"
            exit 1
          fi

          for package in build-output/*.deb; do
            echo "Package: $package"

            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
          done

      # 10. Upload artifact
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: redalien-ios12
          path: build-output/*.deb
          if-no-files-found: error
          retention-days: 14
