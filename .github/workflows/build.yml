name: Build RedAlien for iOS 12

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos & Toolchain (Fast Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot xz-utils zip unzip curl git perl libio-compress-perl
          
          GH="https://github.com"
          sudo curl -fsSL "$GH/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64" -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid

          # Клонируем Theos
          git clone --recursive "$GH/theos/theos.git" "$GITHUB_WORKSPACE/theos"

          # Скачиваем готовый iOS toolchain для Linux
          mkdir -p "$GITHUB_WORKSPACE/theos/toolchain/linux/iphone"
          curl -fsSL "$GH/theos/toolchain/releases/download/v0.1.3/iOS-toolchain-linux-x86_64.tar.xz" -o /tmp/toolchain.tar.xz
          tar -xJf /tmp/toolchain.tar.xz -C "$GITHUB_WORKSPACE/theos/toolchain/linux/iphone" --strip-components=1

          # Скачиваем SDK
          rm -rf "$GITHUB_WORKSPACE/theos/sdks"
          git clone --depth 1 "$GH/theos/sdks.git" "$GITHUB_WORKSPACE/theos/sdks"

      - name: Build DEB package
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: redalien-ios12
          path: packages/*.deb
